  <script>
    // who：誰在說話；show：畫面上出現誰；audio：之後放聲音檔，例如 'audio/shingles-01.mp3'
    window.STORY = [
      { who: 'gulugu', show: ['gulugu'], secs: 6,
        text: '哎喲！我腰這邊<strong>一邊</strong>好痛，還長了一排<strong>水泡</strong>！' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 7,
        text: '這可能是<strong>皮蛇</strong>！小時候得過<strong>水痘</strong>，病毒會一直躲在神經裡。' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 6,
        text: '年紀大了、抵抗力變差，病毒就跑出來了。' },
      { who: 'gulugu', show: ['gulugu', 'xiajiucai'], secs: 5,
        text: '聽說皮蛇<strong>繞身體一圈</strong>就會死？' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 7, big: '❌ 沒這回事',
        text: '皮蛇通常只長在身體<strong>一邊</strong>，不會繞一圈。' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 7, big: '🏥 3 天內看醫生',
        text: '要趕快去看醫生！最好在<strong>3 天（72 小時）內</strong>開始吃藥。' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 7, big: '🚫 不抓 🚫 不亂敷',
        text: '水泡<strong>不要抓破</strong>，也<strong>不要亂敷草藥</strong>，會感染。' },
      { who: 'gulugu', show: ['gulugu', 'xiajiucai'], secs: 5,
        text: '那我可以抱小孫子嗎？' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 8,
        text: '先不要！<strong>沒得過水痘</strong>的小孩，碰到水泡可能被傳染<strong>水痘</strong>。' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 8, big: '💉 50 歲以上',
        text: '50 歲以上，可以問醫生打<strong>皮蛇疫苗</strong>，要打<strong>兩劑</strong>。' },
      { who: 'gulugu', show: ['gulugu', 'xiajiucai'], secs: 7, big: '一邊痛＋水泡 → 3 天內看醫生',
        text: '我記住了！' }
    ];
  </script>
