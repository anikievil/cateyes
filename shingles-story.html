    <h1 class="story-title">皮蛇小故事</h1>

    <p class="note">故事內容依據本站〈皮蛇（帶狀疱疹）〉頁的資料來源整理，僅供衛教參考，不能取代醫師診斷。</p>

  <script>
    // who：誰在說話；show：畫面上出現誰；audio：之後放聲音檔，例如 'audio/shingles-01.mp3'
    window.STORY = [
      { who: 'gulugu', show: ['gulugu'], secs: 6,
        text: '哎喲喲～我腰這邊<strong>一邊</strong>好痛，還冒出一排<strong>水泡</strong>耶……' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 6,
        text: '嘿嘿，我知道！這是<strong>皮蛇</strong>啦！要不要我考考你？' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 7,
        text: '你小時候得過<strong>水痘</strong>吧？病毒偷偷躲在神經裡，躲了好多年喔！' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 6,
        text: '等你年紀大、抵抗力變差，它就跑出來搗蛋啦～' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 5,
        text: '而且聽說皮蛇<strong>繞身體一圈</strong>就會死喔～' },
      { who: 'gulugu', show: ['gulugu', 'xiajiucai'], secs: 4,
        text: '真、真的嗎？！嗚嗚……' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 7, big: '❌ 沒這回事',
        text: '騙你的啦！皮蛇通常只長在身體<strong>一邊</strong>，不會繞一圈。' },
      { who: 'gulugu', show: ['gulugu', 'xiajiucai'], secs: 5,
        text: '那……我睡一覺就會好了吧？' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 7, big: '🏥 3 天內看醫生',
        text: '這次不開玩笑！要趕快看醫生，最好<strong>3 天（72 小時）內</strong>開始吃藥。' },
      { who: 'gulugu', show: ['gulugu', 'xiajiucai'], secs: 5,
        text: '好癢喔，我抓一下就好……' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 7, big: '🚫 不抓 🚫 不亂敷',
        text: '住手！水泡<strong>不要抓破</strong>，也<strong>不要亂敷草藥</strong>，會感染！' },
      { who: 'gulugu', show: ['gulugu', 'xiajiucai'], secs: 5,
        text: '那我可以抱小孫子嗎？' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 8,
        text: '先不要！<strong>沒得過水痘</strong>的小孩，碰到水泡可能被傳染<strong>水痘</strong>。' },
      { who: 'xiajiucai', show: ['gulugu', 'xiajiucai'], secs: 8, big: '💉 50 歲以上',
        text: '還有喔，50 歲以上可以問醫生打<strong>皮蛇疫苗</strong>，要打<strong>兩劑</strong>。' },
      { who: 'gulugu', show: ['gulugu', 'xiajiucai'], secs: 7, big: '一邊痛＋水泡 → 3 天內看醫生',
        text: '嘿嘿，我記住了！' }
    ];
  </script>
